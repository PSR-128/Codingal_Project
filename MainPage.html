<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sustainable Cities</title>
    <style>
        .quiz-container {
            background-color: #3EB489;
            padding: 8.5px;
        }

        .quiz {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        body {
            font-family: 'Roboto', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f2f2f2;
            width: 100%;
            height: 100%;
        }

        header {
            background-image: url('https://energync.org/wp-content/uploads/2021/05/CleanvNotClean-image2021v3.jpg');
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
            opacity: 0.7;
            padding: 7.18rem 4rem;
            color: #333;
            text-align: left;
            position: relative;
        }

        @keyframes backgroundAnimate {
            0% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        h1,
        h2 {
            color: #eecf3f;
            animation: slideInLeft 1s ease-in-out;
        }

        @keyframes slideInLeft {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        main {
            padding: 2rem;
            margin: 0 auto;
            max-width: 800px;
            color: #333;
        }

        footer {
            background-color: #5ba827;
            color: white;
            text-align: center;
            padding: 1rem;
            margin-top: 1.5rem;
        }

        @media screen and (max-width: 600px) {
            main {
                width: 100%;
            }
        }

        .news-box {
            border: 2px solid #3EB489;
            padding: 20px;
            margin-bottom: 20px;
        }

        .news-title {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .news-image {
            max-width: 100%;
            height: auto;
            margin-bottom: 10px;
        }

        .news-content {
            font-size: 16px;
        }

        /* New styles for dynamically fetched news */
        .news-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .news-box {
            width: calc(33.33% - 20px);
            border: 2px solid #3EB489;
            padding: 20px;
            margin: 10px;
        }

        .news-title {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .news-image {
            width: 100%;
            height: auto;
            margin-bottom: 10px;
        }

        .news-content {
            font-size: 16px;
        }

        .read-more {
            display: block;
            margin-top: 10px;
            text-align: center;
            color: #3EB489;
            text-decoration: none;
            font-weight: bold;
        }

        .read-more:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<header>
    <div class="quiz-container">
        <h3 class="quiz"><a href="quiz.html">Quiz</a></h3>
    </div>
    <div>
        <strong><h1 style="text-align: left; margin-top: -0.3rem;">SDG-7 Clean Energy</h1></strong>
        <h2 style="text-align: left; margin-top: -0.3rem;">UN SDG</h2>
        <p>The UN SDG(United Nations Sustainable Development Goals) are 17 sustainable goals towards the betterment of social life and environment. And the primary way in doing so is <b>through clean energy</b></p>
    </div>
</header>
<main>
    <h2>Renewable Energy News:</h2>
    <div class="news-container" id="news-container">
        <!-- News articles will be dynamically added here -->
    </div>
</main>
<footer>
    &copy; 2024 Sustainable Cities. All rights reserved
</footer>

<!-- JavaScript to fetch and display news articles -->
<script>
    // Your NewsAPI key
    const apiKey = '94b4958687e44ec381ee8088a34bf7d3';

    // Function to fetch news articles from NewsAPI
    async function fetchNews() {
        const apiUrl = `https://newsapi.org/v2/everything?q=renewable+energy&apiKey=${apiKey}&pageSize=3`;

        try {
            const response = await fetch(apiUrl);
            const data = await response.json();

            // Display news articles on webpage
            const newsContainer = document.getElementById('news-container');
            data.articles.forEach((article, index) => {
                const newsBox = document.createElement('div');
                newsBox.classList.add('news-box');

                const newsTitle = document.createElement('h3');
                newsTitle.classList.add('news-title');
                newsTitle.textContent = article.title;
                newsBox.appendChild(newsTitle);

                const newsImage = document.createElement('img');
                newsImage.classList.add('news-image');
                newsImage.src = article.urlToImage || 'https://via.placeholder.com/150';
                newsImage.alt = article.title;
                newsBox.appendChild(newsImage);

                const newsContent = document.createElement('p');
                newsContent.classList.add('news-content');
                newsContent.textContent = article.description;
                newsBox.appendChild(newsContent);

                const readMore = document.createElement('a');
                readMore.classList.add('read-more');
                readMore.href = article.url;
                readMore.textContent = 'Read More';
                newsBox.appendChild(readMore);

                newsContainer.appendChild(newsBox);
            });
        } catch (error) {
            console.error('Error fetching news:', error);
        }
    }

    // Fetch news articles when the page loads
    window.onload = fetchNews;
</script>
</body>
</html>
