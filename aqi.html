<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Energy Air Quality Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #7effb6, #56ab2f);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .link-container {
            color: #7effb6; /* Changed link text color */
            font-size: 20px;
            text-transform: uppercase;
            padding: 2px 12px;
            background-color: #0d6c34; /* Changed background color */
            border-radius: 20px 20px 0px 0px; /* Rounded border */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Added shadow */

            max-height:100px;
            justify-content: space-around; /* Evenly space the links */
        }

.link-container a {
    text-decoration: none;
    color: #fff; /* Changed link text color */
    padding: 10px 20px;
    border-radius: 5px;
    margin: 0 10px;
    transition: background-color 0.3s ease, transform 0.3s ease; /* Added transition */
}

.link-container a:hover {
    background-color: #6a1fc2; /* Darker background color on hover */
    transform: translateY(-3px); /* Move the link slightly upwards on hover */
}


        .container {
            text-align: center;
            padding: 20px;
            margin: 20px auto;
            position: relative;
        }

        #cityInput {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            box-sizing: border-box;
            border: 2px solid #ccc;
            border-radius: 5px;
            transition: border-color 0.3s ease-in-out;
        }

        #cityInput:focus {
            border-color: #56ab2f;
            outline: none;
        }

        .header-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }


        .link-button {
            background-color: #7d2ae8; /* Purple background */
            border: none;
            color: #fff;
            padding: 15px 30px;
            border-radius: 50px; /* Rounded border */
            font-size: 18px; /* Increase font size */
            font-weight: bold; /* Bold text */
            text-transform: uppercase; /* Uppercase text */
            letter-spacing: 1px; /* Spacing between letters */
            cursor: pointer; /* Change cursor to pointer */
            transition: background-color 0.3s ease; /* Smooth hover transition */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Add shadow */
        }

        .link-button:hover {
            background-color: #6a1fc2; /* Darker purple on hover */
        }

        .circular-progress {
            position: relative;
            height: 250px;
            width: 250px;
            border-radius: 50%;
            background: conic-gradient(#7d2ae8 3.6deg, #ededed 0deg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .circular-progress::before {
            content: "";
            position: absolute;
            height: 210px;
            width: 210px;
            border-radius: 50%;
            background-color: #fff;
        }

        .progress-value {
            position: relative;
            font-size: 40px;
            font-weight: 600;
            color: #7d2ae8;
        }

        .text {
            font-size: 30px;
            font-weight: 500;
            color: #606060;
        }

        .header {
            color: #7effb6;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 2px 12px;
            background-color: #333333;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 150px;

        }

    </style>
</head>
<body>
    <header class="header-container">
        <div class="header">Air Quality</div>
        <div class="link-container">
            <a href="home.html">Home</a>
            <a href="quiz.html">Quiz</a>
            <a href="clean_energy.html">Clean Energy</a>
        </div>
    </header>
    <div class="container">
        <input type="text" id="cityInput" placeholder="Enter city name">
        <button onclick="getAirQualityData()" class="link-button">Get Air Quality Data</button>
        <!-- Circular progress bar -->
        <div class="circular-progress" id="progressCircle">
            <span class="progress-value" id="progressText"></span>
        </div>
        <span class="text">Air Quality Index</span>
    </div>

    <script>
        function getAirQualityData() {
            var cityName = document.getElementById("cityInput").value;
            fetch(`/get_aqi?city=${cityName}`)
                .then(response => response.json())
                .then(data => {
                    var aqi = data.aqi;
                    var progressText = document.getElementById("progressText");
                    progressText.innerText = aqi;
                    animateProgressBar(aqi);
                })
                .catch(error => console.error('Error:', error));
        }

        function animateProgressBar(aqi) {
            var progressBar = document.getElementById("progressCircle");
            var progressValue = (aqi / 500) * 360;
            progressBar.style.background = `conic-gradient(#7d2ae8 ${progressValue}deg, #ededed 0deg)`;
        }
    </script>
</body>
</html>
