<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Energy Air Quality Checker</title>
    <style>
        :root {
            /* Color scheme and other root variables */
            --background-color: #007bff;
            --text-color: #333;
            --accent-color: #ffd700;
            --button-hover-color: #6a1fc2;
            --header-background: #333333;
            --link-color: #7effb6;
            --link-hover-color: #333333;
            --input-border-color: #ccc;
            --input-placeholder-color: #ccc;
            --input-focus-border-color: #56ab2f;
            --input-label-color: #ccc;
            --input-label-focus-color: #999;
            --progress-value-color: #00FF00;
            --inner-textbox-color: #3CB371;
            --inner-circular-progress-color: #3CB371;
        }

        body, html {
            font-family: Arial, sans-serif;
            background: #333333;
            color: var(--text-color);
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }

       .header {
            color: var(--link-color);
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 2px 12px;
            background-color: var(--header-background);
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 150px;
            margin-right: auto;
        }

       .link-container {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            font-size: 14px;
            text-transform: uppercase;
            padding: 16px 10px;
            border-radius: 0 0 0 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-height: 50px;
        }

       .link-container a {
            text-decoration: none;
            color: var(--link-color);
            padding: 2px 5px;
            border-radius: 3px;
            margin: 0 5px;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

       .link-container a:hover {
            transform: translateY(-2px);
        }

       .input-container {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            margin-top: 50px;
            margin-right: 20px;
            padding: 0 20px;
        }

       .input-text:focus {
            border-color: var(--input-focus-border-color);
            outline: none;
        }

       .input-label {
            position: absolute;
            top: 50%;
            left: 10px;
            transform: translateY(-50%);
            color: var(--input-label-color);
            pointer-events: none;
            transition: top 0.3s ease, font-size 0.3s ease, color 0.3s ease;
            font-size: 16px;
        }

       .input-text:focus +.input-label,
       .input-text:not(:placeholder-shown) +.input-label {
            top: 0;
            left: 10px;
            font-size: 12px;
            color: var(--input-label-focus-color);
        }

       .submit-button {
            background-color: var(--accent-color);
            border: none;
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 10px;
        }

       .submit-button:hover {
            background-color: var(--button-hover-color);
        }

       .circular-progress {
            position: relative;
            height: 300px;
            width: 300px;
            border-radius: 50%;
            background: conic-gradient(var(--accent-color) 3.6deg, var(--inner-circular-progress-color) 0deg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            margin-left: 20px;
            animation: progressAnimation 1s cubic-bezier(0.785, 0.135, 0.15, 0.86) forwards;
        }

        @keyframes progressAnimation {
            from {
                background: conic-gradient(var(--accent-color) 0deg, var(--inner-circular-progress-color) 0deg);
            }
            to {
                background: conic-gradient(var(--accent-color) 360deg, var(--inner-circular-progress-color) 0deg);
            }
        }

       .circular-progress::before {
            content: "";
            position: absolute;
            height: 250px;
            width: 250px;
            border-radius: 50%;
            background-color: var(--background-color);
        }

       .progress-value {
            position: relative;
            font-size: 60px;
            font-weight: 600;
            color: var(--progress-value-color);
        }

       .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background-color: #333333;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

       .logo {
            height: 50px;
        }

       .logo img {
            height: 100%;
            object-fit: contain;
        }

       .search-bar {
            display: flex;
            align-items: center;
            height: 40px;
            padding: 0 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
            background-color: #f0f0f0;
        }

       .input-text {
            width: 300px;
            padding: 10px;
            margin-bottom: 10px;
        }

       .menu-links {
            display: flex;
            align-items: center;
            font-size: 14px;
            text-transform: uppercase;
        }

       .menu-links a {
            text-decoration: none;
            color: #fff;
            padding: 2px 5px;
            transition: background-color 0.3s ease;
        }

       .menu-links a:hover {
            background-color: #56ab2f;
        }

       .table-container {
            display: flex;
            flex-direction: column;
            width: 64.67%;
            align-items: flex-end;
            position: absolute;
            top:200px;
            right: 40px;
            display:none;
        }
        table {
            color: white;
            background-color: rgba(255, 255, 255, 0.1);
            border-collapse: collapse;
            width: 100%;
            margin-top: 10px; /* Adjust margin as needed */
        }

        th, td {
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
        }

        tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .chart-container {
    position: relative;
    display: block;
    top: 185px;  /* Updated from top-margin to top */
    background-color: #333333;
    color: #ffffff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    margin: 20px;
    width: 90%;
    height: 500px;
    margin: 0 auto;
}


    </style>
</head>
<body>
    <header class="header-container">
        <div class="header">Air Quality</div>
        <div class="link-container">
            <a href="home.html">Home</a>
            <a href="quiz.html">Quiz</a>
            <a href="clean_energy.html">Clean Energy</a>
        </div>
    </header>

    <div class="input-container">
        <input type="text" id="cityInput" class="input-text" placeholder="Enter city name">
        <button onclick="getAirQualityData()" class="submit-button">Get AQI</button>
    </div>

    <div class="circular-progress" id="progressCircle">
        <span class="progress-value" id="progressText"></span>
    </div>

    <div class="table-container" style="display: none;">
        <table id="airQualityTable">
            <thead>
                <tr>
                    <th>Parameter</th>
                    <th>Value</th>
                </tr>
            </thead>
            <tbody id="airQualityTableBody">
                <!-- Table rows will be dynamically added here -->
            </tbody>
        </table>
    </div>

    <div id="aqiChartCanvas" class="chart-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var input = document.getElementById('cityInput');
    input.addEventListener('keypress', function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            getAirQualityData();
        }
    });

    function getAirQualityData() {
        var cityName = document.getElementById("cityInput").value;
        axios.get(`/get_aqi?city=${encodeURIComponent(cityName)}`)
            .then(response => {
                const data = response.data;
                if (data && data.aqi !== undefined && data.air_quality_data) {
                    var aqi = data.aqi;
                    var airQualityData = data.air_quality_data;

                    document.getElementById("progressText").innerText = aqi;
                    populateAirQualityTable(airQualityData);
                    animateProgressBar(aqi);

                    document.querySelector('.table-container').style.display = 'block';
                    document.querySelector('.chart-container').style.display = 'block';

                    // Update the chart with historical AQI data
                    getHistoricalAQIData(cityName);
                } else {
                    console.error('Unexpected response format:', data);
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
    }

    function getHistoricalAQIData(city) {
    axios.get(`/get_historical_aqi_plot?city=${encodeURIComponent(city)}`)
        .then(response => {
            const plotData = response.data;
            if (plotData && !plotData.error) {
                // Assuming plotData is already in the correct format required by Plotly.
                Plotly.newPlot('aqiChartCanvas', plotData);  // Ensure this ID matches the container in your HTML
            } else {
                document.getElementById('aqiChartCanvas').innerHTML = '<p>No data available.</p>';
            }
        })
        .catch(error => {
            console.error('Error fetching plot data:', error);
            document.getElementById('aqiChartCanvas').innerHTML = '<p>Error loading data.</p>';
        });
}

function fetchAndDisplayChart(city) {
    fetch(`/get_historical_aqi_plot?city=${city}`)
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                alert("No data available");
            } else {
                // Correctly use Plotly.newPlot to plot the data
                Plotly.newPlot('aqiChart', JSON.parse(data.plotData));
            }
        })
        .catch(error => console.error('Error loading the AQI data:', error));
}
    function animateProgressBar(aqi) {
        var circle = document.getElementById('progressCircle');
        circle.style.background = `conic-gradient(var(--accent-color) ${aqi * 3.6}deg, var(--inner-circular-progress-color) 0deg)`;
    }

    function populateAirQualityTable(airQualityData) {
        var tableBody = document.getElementById("airQualityTableBody");
        tableBody.innerHTML = ""; // Clear previous data

        Object.entries(airQualityData).forEach(([key, value]) => {
            var row = `<tr><td>${key}</td><td>${value}</td></tr>`;
            tableBody.innerHTML += row;
        });
    }

    if (document.getElementById('cityInput').form) {
        document.getElementById('cityInput').form.onsubmit = function(event) {
    event.preventDefault();  // Prevent the form from submitting
    getAirQualityData();  // Call your function to fetch data
};
    }
});
</script>
</body>
</html>
