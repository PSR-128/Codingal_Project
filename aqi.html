<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Energy Air Quality Checker</title>
    <style>
        :root {
            --background-color: #007bff;
            --text-color: #333;
            --accent-color: #ffd700;
            --button-hover-color: #6a1fc2;
            --header-background: #333333;
            --link-color: #7effb6;
            --link-hover-color: #333333;
            --input-border-color: #ccc;
            --input-placeholder-color: #ccc;
            --input-focus-border-color: #56ab2f;
            --input-label-color: #ccc;
            --input-label-focus-color: #999;
            --progress-value-color: #00FF00;
            --inner-textbox-color: #3CB371;
            --inner-circular-progress-color: #3CB371;
        }

        body {
            font-family: Arial, sans-serif;
            background: #333333;
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

       .header {
            color: var(--link-color);
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 2px 12px;
            background-color: var(--header-background);
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 150px;
            margin-right: auto;
        }

       .link-container {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            font-size: 14px;
            text-transform: uppercase;
            padding: 16px 10px;
            border-radius: 0 0 0 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-height: 50px;
        }

       .link-container a {
            text-decoration: none;
            color: var(--link-color);
            padding: 2px 5px;
            border-radius: 3px;
            margin: 0 5px;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

       .link-container a:hover {
            transform: translateY(-2px);
        }

       .input-container {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            margin-top: 50px;
            margin-right: 20px;
            padding: 0 20px;
        }

       .input-text:focus {
            border-color: var(--input-focus-border-color);
            outline: none;
        }

       .input-label {
            position: absolute;
            top: 50%;
            left: 10px;
            transform: translateY(-50%);
            color: var(--input-label-color);
            pointer-events: none;
            transition: top 0.3s ease, font-size 0.3s ease, color 0.3s ease;
            font-size: 16px;
        }

       .input-text:focus +.input-label,
       .input-text:not(:placeholder-shown) +.input-label {
            top: 0;
            left: 10px;
            font-size: 12px;
            color: var(--input-label-focus-color);
        }

       .submit-button {
            background-color: var(--accent-color);
            border: none;
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 10px;
        }

       .submit-button:hover {
            background-color: var(--button-hover-color);
        }

       .circular-progress {
            position: relative;
            height: 300px;
            width: 300px;
            border-radius: 50%;
            background: conic-gradient(var(--accent-color) 3.6deg, var(--inner-circular-progress-color) 0deg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            margin-left: 20px;
            animation: progressAnimation 1s cubic-bezier(0.785, 0.135, 0.15, 0.86) forwards;
        }

        @keyframes progressAnimation {
            from {
                background: conic-gradient(var(--accent-color) 0deg, var(--inner-circular-progress-color) 0deg);
            }
            to {
                background: conic-gradient(var(--accent-color) 360deg, var(--inner-circular-progress-color) 0deg);
            }
        }

       .circular-progress::before {
            content: "";
            position: absolute;
            height: 250px;
            width: 250px;
            border-radius: 50%;
            background-color: var(--background-color);
        }

       .progress-value {
            position: relative;
            font-size: 60px;
            font-weight: 600;
            color: var(--progress-value-color);
        }

       .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background-color: #333333;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

       .logo {
            height: 50px;
        }

       .logo img {
            height: 100%;
            object-fit: contain;
        }

       .search-bar {
            display: flex;
            align-items: center;
            height: 40px;
            padding: 0 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
            background-color: #f0f0f0;
        }

       .input-text {
            width: 300px;
            padding: 10px;
            margin-bottom: 10px;
        }

       .menu-links {
            display: flex;
            align-items: center;
            font-size: 14px;
            text-transform: uppercase;
        }

       .menu-links a {
            text-decoration: none;
            color: #fff;
            padding: 2px 5px;
            transition: background-color 0.3s ease;
        }

       .menu-links a:hover {
            background-color: #56ab2f;
        }

       .table-container {
            display: flex;
            flex-direction: column;
            width: 64.67%;
            align-items: flex-end;
            position: absolute;
            top:200px;
            right: 40px;
            display:none;
        }



        table {
            color: white;
            background-color: rgba(255, 255, 255, 0.1);
            border-collapse: collapse;
            width: 100%;
            margin-top: 10px; /* Adjust margin as needed */
        }

        th, td {
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
        }

        tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <header class="header-container">
        <div class="header">Air Quality</div>
        <div class="link-container">
            <a href="home.html">Home</a>
            <a href="quiz.html">Quiz</a>
            <a href="clean_energy.html">Clean Energy</a>
        </div>
    </header>
    <div class="input-container">
        <input type="text" id="cityInput" class="input-text textbox-right" placeholder="Enter city name">
        <button onclick="getAirQualityData()" class="submit-button">Get AQI</button>
    </div>
    <div class="circular-progress" id="progressCircle">
        <span class="progress-value" id="progressText"></span>
    </div>

    <div class="table-container">
        <table id="airQualityTable">
            <thead>
                <tr>
                    <th>Parameter</th>
                    <th>Value</th>
                </tr>
            </thead>
            <tbody id="airQualityTableBody">
                <!-- Table rows will be dynamically added here -->
            </tbody>
        </table>
    </div>

    <script>
        function animateProgressBar(aqi) {
            // Implement progress animation if needed
        }

        function populateAirQualityTable(airQualityData) {
            var tableBody = document.getElementById("airQualityTableBody");
            tableBody.innerHTML = ""; // Clear previous data

            for (var key in airQualityData) {
            if (airQualityData.hasOwnProperty(key)) {
                var value = airQualityData[key];
                var row = `<tr><td>${key}</td><td>${value}</td></tr>`;
                tableBody.innerHTML += row;
            }
        }

        }

     function getAirQualityData() {
    var cityName = document.getElementById("cityInput").value;
    fetch(`/get_aqi?city=${cityName}`)
       .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
       .then(data => {
            if (data && data.aqi !== undefined && data.air_quality_data) {
                var aqi = data.aqi;
                var airQualityData = data.air_quality_data;

                var progressText = document.getElementById("progressText");
                progressText.innerText = aqi;

                populateAirQualityTable(airQualityData);
                animateProgressBar(aqi);

                // Show the table after data is fetched
                document.querySelector('.table-container').style.display = 'block';
            } else {
                console.error('Unexpected response format:', data);
            }
        })
       .catch(error => {
            console.error('Error:', error);
        });
}
    </script>
</body>
</html>
