<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Quality Index Checker</title>
    <style>
        /* CSS styles for the background and theme */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #00b894, #00cec9);
            margin: 0;
            padding: 0;
            overflow-x: hidden; /* Prevent horizontal overflow */
        }
        .container {
            text-align: center;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            margin: 20px;
        }
        h1 {
            margin-bottom: 20px;
            color: #333;
        }
        #cityInput {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            box-sizing: border-box;
            border: 2px solid #ccc;
            border-radius: 5px;
            transition: border-color 0.3s ease-in-out;
        }
        #cityInput:focus {
            border-color: #00b894;
            outline: none;
        }
        .link-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .link-container a {
            text-decoration: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            margin: 0 10px;
            background-color: #00b894;
            transition: background-color 0.3s ease;
        }
        .link-container a:hover {
            background-color: #00cec9;
        }
        /* CSS styles for the progress bar */
        .progress-circle {
            margin: 20px auto;
            width: 120px;
            height: 120px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        .progress-bar {
            position: absolute;
            width: 100%;
            height: 100%;
            background: conic-gradient(#00b894, #00cec9);
            border-radius: 50%;
            clip: rect(0px, 120px, 120px, 60px); /* Clip half of the circle */
        }
        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <header>
        <div class="link-container">
            <a href="home.html">Home</a>
            <a href="quiz.html">Quiz</a>
            <a href="clean_energy.html">Clean Energy</a>
        </div>
    </header>
    <div class="container">
        <input type="text" id="cityInput" placeholder="Enter city name">
        <button onclick="getAirQualityData()" class="link-button">Get Air Quality Data</button>
        <div class="progress-circle" id="progressCircle">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText"></div>
        </div>
    </div>

    <script>
        function getAirQualityData() {
            var cityName = document.getElementById("cityInput").value;
            fetch(`/get_aqi?city=${cityName}`)
                .then(response => response.json())
                .then(data => {
                    var aqi = data.aqi;
                    var progress = aqi / 500;  // Calculate progress percentage
                    var progressBar = document.getElementById("progressBar");
                    var progressText = document.getElementById("progressText");
                    progressBar.style.transform = `rotate(${progress * 360}deg)`;  // Rotate the progress bar
                    progressText.innerText = aqi;  // Display AQI value
                })
                .catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
