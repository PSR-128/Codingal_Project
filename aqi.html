<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Energy Air Quality Checker</title>
    <style>
        /* Default color scheme */
        :root {
            --background-color: #1a1a1a;
            --text-color: #333;
            --accent-color: #7d2ae8;
            --button-hover-color: #6a1fc2;
            --header-background: #333333;
            --link-color: #7effb6;
            --link-hover-color: #333333; /* Changed link hover color */
            --input-border-color: #ccc;
            --input-placeholder-color: #ccc;
            --input-focus-border-color: #56ab2f;
            --input-label-color: #ccc;
            --input-label-focus-color: #999;
            --circular-progress-background: #ededed;
            --progress-value-color: #7d2ae8;
            --inner-textbox-color: #3CB371; /* New color for textbox */
            --inner-circular-progress-color: #3CB371; /* New color for circular progress bar */
        }

        /* Common styles */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(45deg, #003366, #00cccc);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .header-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header {
            color: var(--link-color);
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 2px 12px;
            background-color: var(--header-background);
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 150px;
        }

        .link-container {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            text-transform: uppercase;
            padding: 2px 12px;
            background-color: var(--accent-color);
            border-radius: 20px 20px 0px 0px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-height: 100px;
        }

        .link-container a {
            text-decoration: none;
            color: var(--link-color);
            padding: 2px 12px;
            border-radius: 5px;
            margin: 0 10px;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .link-container a:hover {
            background-color: var(--link-hover-color);
            transform: translateY(-3px);
        }

        .input-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 50px;
        }

        .input-text {
            width: 300px;
            padding: 10px;
            box-sizing: border-box;
            border: 2px solid var(--input-border-color);
            border-radius: 5px;
            transition: border-color 0.3s ease-in-out;
            margin-right: 10px;
            position: relative;
            background-color: var(--inner-textbox-color); /* Updated color for textbox */
            color: var(--text-color);
        }

        .input-text:focus {
            border-color: var(--input-focus-border-color);
            outline: none;
        }

        .input-label {
            position: absolute;
            top: 50%;
            left: 10px; /* Adjusted left position */
            transform: translateY(-50%);
            color: var(--input-label-color);
            pointer-events: none;
            transition: top 0.3s ease, font-size 0.3s ease, color 0.3s ease;
            font-size: 16px;
        }

        .input-text:focus + .input-label,
        .input-text:not(:placeholder-shown) + .input-label {
            top: 0;
            left: 10px; /* Adjusted left position */
            font-size: 12px;
            color: var(--input-label-focus-color);
        }

        .submit-button {
            background-color: var(--accent-color);
            border: none;
            color: var(--text-color);
            padding: 2px 12px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .submit-button:hover {
            background-color: var(--button-hover-color);
        }

        .circular-progress {
            position: relative;
            height: 250px;
            width: 250px;
            border-radius: 50%;
            background: conic-gradient(var(--accent-color) 3.6deg, var(--inner-circular-progress-color) 0deg); /* Updated inner color for circular progress bar */
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            margin-top: 50px;
        }

        .circular-progress::before {
            content: "";
            position: absolute;
            height: 210px;
            width: 210px;
            border-radius: 50%;
            background-color: var(--background-color);
        }

        .progress-value {
            position: relative;
            font-size: 40px;
            font-weight: 600;
            color: var(--progress-value-color);
        }
        $seedling-size: 20px; // Adjust as needed

        .progress-container {
            position: relative;
            width: 300px; // Adjust as needed
            height: 300px; // Adjust as needed
        }
    </style>
</head>
<body>
    <header class="header-container">
        <div class="header">Air Quality</div>
        <div class="link-container">
            <a href="home.html">Home</a>
            <a href="quiz.html">Quiz</a>
            <a href="clean_energy.html">Clean Energy</a>
        </div>
    </header>
    <div class="input-container">
        <input type="text" id="cityInput" class="input-text" placeholder="Enter city name">
        <button onclick="getAirQualityData()" class="submit-button">Get AQI</button>
    </div>
    <div class="circular-progress" id="progressCircle">
        <span class="progress-value" id="progressText"></span>
    </div>
    <script>
        function getAirQualityData() {
            var cityName = document.getElementById("cityInput").value;
            fetch(`/get_aqi?city=${cityName}`)
                .then(response => response.json())
                .then(data => {
                    var aqi = data.aqi;
                    var progressText = document.getElementById("progressText");
                    progressText.innerText = aqi;
                    animateProgressBar(aqi);
                })
                .catch(error => console.error('Error:', error));
        }

        function animateProgressBar(aqi) {
            var progressBar = document.getElementById("progressCircle");
            var progressValue = (aqi / 500) * 360;
            progressBar.style.background = `conic-gradient(#7d2ae8 ${progressValue}deg, #ededed 0deg)`;
        }
    </script>
</body>
</html>
