<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Clean Energy Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(to right, #3EB489, #16A085);
            margin: 0;
            padding: 0;
            color: #333;
        }

        .link-container {
            background-color: #3EB489;
            padding: 5px 20px; /* Adjusted padding */
            text-align: right;
        }

        .link {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }

        header {
            background-color: #3EB489;
            text-align: center;
            color: #fff;
            font-size: 15%; /*<!-- this chnages the header size -->*/
        }

        #quiz {
            max-width: 550px;
            margin: 10px auto;
            background-color: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            position: relative;
            animation: slide-in 1s ease-out forwards;
        }

        h1 {
            text-align: center;
            color: #3EB489;
            margin-top: 0;
        }

        h2 {
            margin-bottom: 20px;
            color: #3EB489;
        }

        form {
            margin-top: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            cursor: pointer;
        }

        input[type="radio"] {
            margin-right: 10px;
            cursor: pointer;
        }

        #notification {
            display: none;
            background-color: #4caf50;
            color: #fff;
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            animation: slide-in 1s ease-out forwards;
        }

        #submitBtn {
            background-color: #3EB489;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
            display: block;
            margin: 0 auto;
            animation: slide-in 1s ease-out forwards;
        }

        #submitBtn:hover {
            background-color: #45a049;
        }
#solarFacts {
            position: absolute;
            bottom: -80px;
            left: -100%; /* Initially set to left outside of the screen */
            width: calc(100% - 40px);
            padding: 20px;
            box-sizing: border-box;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            opacity: 0;
            text-align: center;
            transform: translateY(-50%);
            animation: solarFacts 2s ease-in-out forwards; /* Use the same animation name */
        }

        #solarFacts.show {
            left: 50%; /* Slide to center when shown */
            opacity: 1;
            transition: left 10s ease, opacity 2s ease; /* Added transition */
        }

        @keyframes solarFacts {
            to {
                left: 50%; /* Move to the center of the screen */
                transform: translateX(-50%);
            }
        }


        @keyframes slide-in {
            0% {
                transform: translateY(50px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }
        nav > ul {
			display: inline;
			padding: auto;
		}
        nav >  ul > li {
			display: inline-block;
			list-style: none;
			margin: 0 5px 0 5px

		}
        nav a:link, a:visited {
        	color: black;
            text-decoration: none;
        }
        nav a:hover, a:active {
        	color: grey;
            text-decoration: underline;
        }
    </style>
</head>
<body>
<nav>
    <ul>
    <li><h3><a href="MainPage.html">Home Page</a></h3></li>
    <li><h3><a href="aqi.html">Air Quality</a></h3></li>
    <li><h3><a href="pollution.html">Clean Energy</a></h3></li>
    </ul>
</nav>
    <header>
        <h1>Daily Clean Energy Quiz</h1>
    </header>
    <div id="quiz">
        <h2 id="question"></h2>
        <form id="quizForm"></form>
        <button id="submitBtn">Submit</button>
        <div id="notification"></div>
        <div id="solarFacts">
            <p>fun facts over here</p>
        </div>
    </div>
<script>
        var quizData = [
            {
                'question': 'Which of the following is a renewable energy source?',
                'options': ['Coal', 'Solar', 'Natural Gas', 'Oil'],
                'answer': 'Solar'
            },
            {
                'question': 'What is the primary greenhouse gas emitted by burning fossil fuels?',
                'options': ['Carbon Dioxide', 'Nitrous Oxide', 'Methane', 'Ozone'],
                'answer': 'Carbon Dioxide'
            },
            {
                'question': 'Which renewable energy source generates electricity by harnessing the wind?',
                'options': ['Hydropower', 'Geothermal', 'Biomass', 'Wind'],
                'answer': 'Wind'
            }
        ];

        function loadQuiz() {
            var quizIndex = (new Date().getDay()) % quizData.length;
            var question = quizData[quizIndex].question;
            var options = quizData[quizIndex].options;
            var correctAnswer = quizData[quizIndex].answer;
            var quizForm = document.getElementById('quizForm');
            var html = '';

            document.getElementById('question').textContent = question;

            options.forEach(function(option, index) {
                html += '<label><input type="radio" name="answer" id="option' + index + '" value="' + option + '"> ' + option + '</label>';
            });

            quizForm.innerHTML = html;
        }

        function showNotification(message) {
            var notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.display = 'block';
            setTimeout(function() {
                notification.style.display = 'none';
            }, 3000); // Hide after 3 seconds
        }

        window.onload = function() {
            loadQuiz();
            var submitBtn = document.getElementById('submitBtn');
            var solarFacts = document.getElementById('solarFacts');
            submitBtn.addEventListener('click', function(event) {
                event.preventDefault();
                var selectedAnswer = document.querySelector('input[name="answer"]:checked');
                if (!selectedAnswer) {
                    alert('Please select an answer.');
                    return;
                }
                var correctAnswer = quizData[(new Date().getDay()) % quizData.length].answer;
                if (selectedAnswer.value === correctAnswer) {
                    showNotification('Correct! Well done!');
                } else {
                    showNotification('Incorrect. The correct answer is: ' + correctAnswer);
                }
                solarFacts.classList.add('show');
                setTimeout(function() {
                    solarFacts.style.left = '50%';
                    solarFacts.style.opacity = '1';
                }, 1000); // Wait for the previous animation to complete
            });

            // Fix for radio buttons not functioning
            var radioInputs = document.querySelectorAll('input[type="radio"]');
            radioInputs.forEach(function(radioInput) {
                radioInput.addEventListener('change', function() {
                    var notification = document.getElementById('notification');
                    notification.style.display = 'none';
                });
            });
        }
    </script>
</body>
</html>
