<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Clean Energy Quiz</title>

    <style>
       .root {
            --header-background: #000000; /* Define custom property */
        }

        body {
            font-family: Arial, sans-serif;
            background: #000000; /* Same background color as aqi.html */
            color: #fff; /* White text color */
            margin: 0;
            padding: 0;
        }

       .link-container {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            font-size: 14px;
            text-transform: uppercase;
            padding: 16px 10px;
            border-radius: 0 0 0 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-height: 50px;
            background-color: var(--header-background);
        }


       .link-container a {
            text-decoration: none;
            color: #7effb6;
            padding: 2px 5px;
            border-radius: 3px;
            margin: 0 5px;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

       .link-container a:hover {
            transform: translateY(-2px);
        }

        header {
            background-color: #000000; /* Header background color */
            padding: 20px;
            text-align: center;
        }

        #quiz {
            max-width: 550px;
            margin: 10px auto;
            background-color: #ffffff; /* Quiz background color */
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            position: relative;
            animation: slide-in 1s ease-out forwards;
        }

        h1 {
            margin-top: 0;
            color: #ff69b4; /* Set a fabulous color of your choice */
        }

        h2 {
            margin-bottom: 20px;
            color: #3EB489; /* Question text color */
        }

        form {
            margin-top: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            cursor: pointer;
            color: #fff; /* Label text color */
        }

        input[type="radio"] {
            margin-right: 10px;
            cursor: pointer;
        }

        #notification {
            display: none;
            background-color: #4caf50;
            color: #fff;
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            animation: slide-in 1s ease-out forwards;
        }

        #submitBtn {
            background-color: #3EB489;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
            display: block;
            margin: 0 auto;
            animation: slide-in 1s ease-out forwards;
        }

        #submitBtn:hover {
            background-color: #45a049;
        }

        #solarFacts {
            position: absolute;
            bottom: -80px;
            left: -100%; /* Initially set to left outside of the screen */
            width: calc(100% - 40px);
            padding: 20px;
            box-sizing: border-box;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            opacity: 0;
            text-align: center;
            transform: translateY(-50%);
            animation: solarFacts 2s ease-in-out forwards; /* Use the same animation name */
            color: black;
        }

        #solarFacts.show {
            left: 50%; /* Slide to center when shown */
            opacity: 1;
            transition: left 10s ease, opacity 2s ease; /* Added transition */
        }

        @keyframes solarFacts {
            to {
                left: 50%; /* Move to the center of the screen */
                transform: translateX(-50%);
            }
        }

        @keyframes slide-in {
            0% {
                transform: translateY(50px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .header {
            color: var(--link-color);
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 2px 12px;
            background-color: var(--header-background);
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 150px;
            margin-right: auto;
        }
        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background-color: #000000;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            color: #7effb6;
        }
        #quiz {
            max-width: 550px;
            margin: 10px auto;
            background-color: #ffffff; /* Quiz background color */
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            position: relative;
            animation: slide-in 1s ease-out forwards;
            margin-top: 20px; /* Add margin-top to create space between header and quiz */
        }
        #quizForm label {
            color: #000000; /* Change the text color to dark gray */
        }


@media (max-width: 768px) {
    #quiz {
        margin-top: 50px; /* Adjust margin-top for smaller screens */
    }
}
    </style>
</head>
<body>
    <div class="link-container">
        <b><a href="home.html" class="link">Home</a>
        <a href="aqi.html" class="link">Air Quality</a>
        <a href="clean_energy.html" class="link">Clean Energy</a></b>
    </div>

    <header class = "header-container">
         <div class="header">QUIZ</div>
    </header>
    <header>
        <h1>Daily Clean Energy Quiz</h1>
    </header>
    <div id="quiz">
        <h2 id="question"></h2>
        <form id="quizForm"></form>
        <button id="submitBtn">Submit</button>
        <div id="notification"></div>
        <div id="solarFacts">
            <p>Fun Facts:<br>
                Energy generation from sunlight was invented by Alexandre Edmond Becquerel in 1839.                
            </p>
        </div>
    </div>
    <script>
        var quizData = [
            {
                'question': 'Which of the following is a renewable energy source?',
                'options': ['Coal', 'Solar', 'Natural Gas', 'Oil'],
                'answer': 'Solar'
            },
            {
                'question': 'What is the primary greenhouse gas emitted by burning fossil fuels?',
                'options': ['Carbon Dioxide', 'Nitrous Oxide', 'Methane', 'Ozone'],
                'answer': 'Carbon Dioxide'
            },
            {
                'question': 'Which renewable energy source generates electricity by harnessing the wind?',
                'options': ['Hydropower', 'Geothermal', 'Biomass', 'Wind'],
                'answer': 'Wind'
            },
            {
                'question': 'Which of the following is a disadvantage of renewable energy?',
                'options': ['High pollution', 'Available only in few places', 'High running cost', 'Unreliable Supply'],
                'answer': 'Unreliable Supply'
            },
            {
                'question': 'A Solar cell is an electrical device that converts the energy of light directly into electricity by the ____________',
                'options': ['Photovoltaic effect', 'Chemical effect', 'Atmospheric effect', 'Physical effect'],
                'answer': 'Photovoltaic effect'
            },
            {
                "question": "What is the primary advantage of wind power?",
                "options": ["High initial cost", "Intermittency", "No greenhouse gas emissions", "Limited availability"],
                "answer": "No greenhouse gas emissions"
            },
            {
                "question": "Hydropower is generated by harnessing the energy of which natural resource?",
                "options": ["Sunlight", "Water", "Natural Gas", "Wind"],
                "answer": "Water"
            },
            {
                "question": "Which of the following is a biomass energy source?",
                "options": ["Petroleum", "Coal", "Wood", "Uranium"],
                "answer": "Wood"
            },
            {
                "question": "Geothermal energy is derived from which source?",
                "options": ["Wind", "Water", "Volcanic activity", "Solar radiation"],
                "answer": "Volcanic activity"
            },
            {
                "question": "Which country is the largest producer of wind energy?",
                "options": ["China", "United States", "Germany", "India"],
                "answer": "China"
            },
            {
                "question": "Which of the following is NOT a benefit of renewable energy?",
                "options": ["Reduced greenhouse gas emissions", "High operational costs", "Improved air quality", "Energy security"],
                "answer": "High operational costs"
            },
            {
                "question": "Which renewable energy source relies on the natural flow of water to generate electricity?",
                "options": ["Tidal energy", "Geothermal energy", "Solar energy", "Biomass energy"],
                "answer": "Tidal energy"
            },
            {
                "question": "What is the primary advantage of biomass energy?",
                "options": ["Low availability", "High cost", "Ability to use organic waste", "High greenhouse gas emissions"],
                "answer": "Ability to use organic waste"
            },
            {
                "question": "Which renewable energy source relies on the Earth's internal heat?",
                "options": ["Wind", "Solar", "Geothermal", "Hydropower"],
                "answer": "Geothermal"
            },
            {
                "question": "Which of the following is NOT a form of solar energy technology?",
                "options": ["Photovoltaic cells", "Concentrated solar power", "Solar thermal collectors", "Tidal power"],
                "answer": "Tidal power"
            },
            {
                "question": "What is the main environmental concern associated with hydropower?",
                "options": ["Greenhouse gas emissions", "Water pollution", "Habitat disruption", "Noise pollution"],
                "answer": "Habitat disruption"
            },
            {
                "question": "Which of the following regions has the highest solar energy potential?",
                "options": ["Antarctica", "Sahara Desert", "Amazon Rainforest", "Greenland"],
                "answer": "Sahara Desert"
            },
            {
                "question": "What is the main advantage of tidal energy?",
                "options": ["High predictability", "Low installation cost", "Minimal environmental impact", "Easy accessibility"],
                "answer": "High predictability"
            },
            {
                "question": "Which renewable energy source produces electricity by converting ocean waves into energy?",
                "options": ["Wave energy", "Geothermal energy", "Hydropower", "Biomass energy"],
                "answer": "Wave energy"
            },
            {
                "question": "Which renewable energy source can be used for both electricity generation and heating?",
                "options": ["Wind energy", "Geothermal energy", "Hydropower", "Biomass energy"],
                "answer": "Biomass energy"
            },
            {
                "question": "Which of the following is a drawback of wind energy?",
                "options": ["Intermittency", "Low efficiency", "High greenhouse gas emissions", "Limited availability"],
                "answer": "Intermittency"
            },
            {
                "question": "What is the primary advantage of decentralized renewable energy systems?",
                "options": ["High cost", "Increased grid reliance", "Reduced transmission losses", "Higher emissions"],
                "answer": "Reduced transmission losses"
            },
            {
                "question": "Which of the following is NOT a benefit of wind energy?",
                "options": ["Low operational costs", "Scalability", "Reduced dependence on fossil fuels", "Noise pollution"],
                "answer": "Noise pollution"
            },
            {
                "question": "Which of the following is a disadvantage of biomass energy?",
                "options": ["High availability", "Limited feedstock", "Low efficiency", "No greenhouse gas emissions"],
                "answer": "Low efficiency"
            },
            {
                "question": "What is the primary advantage of concentrating solar power (CSP) systems?",
                "options": ["Low upfront costs", "High efficiency", "Minimal land use", "Limited scalability"],
                "answer": "High efficiency"
            },
            {
                "question": "What is the main disadvantage of hydropower?",
                "options": ["Intermittency", "Limited availability", "High environmental impact", "High cost"],
                "answer": "High environmental impact"
            },
            {
                "question": "What is the primary environmental concern associated with large-scale solar farms?",
                "options": ["Land degradation", "Water pollution", "Air pollution", "Noise pollution"],
                "answer": "Land degradation"
            },
            {
                "question": "What is the primary advantage of offshore wind farms compared to onshore wind farms?",
                "options": ["Higher installation costs", "Lower wind speeds", "Minimal visual impact", "Greater wind consistency"],
                "answer": "Greater wind consistency"
            },
            {
                "question": "What is the main challenge associated with biomass energy production?",
                "options": ["Low energy efficiency", "High greenhouse gas emissions", "Limited availability", "Intermittency"],
                "answer": "High greenhouse gas emissions"
            },
            {
                "question": "Which renewable energy source is derived from organic matter that undergoes anaerobic digestion?",
                "options": ["Wind energy", "Solar energy", "Biogas", "Hydropower"],
                "answer": "Biogas"
            }
        ];

        function loadQuiz() {
            var quizIndex = (new Date().getDay()) % quizData.length;
            var question = quizData[quizIndex].question;
            var options = quizData[quizIndex].options;
            var correctAnswer = quizData[quizIndex].answer;
            var quizForm = document.getElementById('quizForm');
            var html = '';

            document.getElementById('question').textContent = question;

            options.forEach(function(option, index) {
                html += '<label><input type="radio" name="answer" id="option' + index + '" value="' + option + '"> ' + option + '</label>';
            });

            quizForm.innerHTML = html;
        }

        function showNotification(message) {
            var notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.display = 'block';
            setTimeout(function() {
                notification.style.display = 'none';
            }, 3000); // Hide after 3 seconds
        }

        window.onload = function() {
            loadQuiz();
            var submitBtn = document.getElementById('submitBtn');
            var solarFacts = document.getElementById('solarFacts');
            submitBtn.addEventListener('click', function(event) {
                event.preventDefault();
                var selectedAnswer = document.querySelector('input[name="answer"]:checked');
                if (!selectedAnswer) {
                    alert('Please select an answer.');
                    return;
                }
                var correctAnswer = quizData[(new Date().getDay()) % quizData.length].answer;
                if (selectedAnswer.value === correctAnswer) {
                    showNotification('Correct! Well done!');
                } else {
                    showNotification('Incorrect. The correct answer is: ' + correctAnswer);
                }
                solarFacts.classList.add('show');
                setTimeout(function() {
                    solarFacts.style.left = '50%';
                    solarFacts.style.opacity = '1';
                }, 1000); // Wait for the previous animation to complete
            });

            // Fix for radio buttons not functioning
            var radioInputs = document.querySelectorAll('input[type="radio"]');
            radioInputs.forEach(function(radioInput) {
                radioInput.addEventListener('change', function() {
                    var notification = document.getElementById('notification');
                    notification.style.display = 'none';
                });
            });
        }
    </script>
</body>
</html>
