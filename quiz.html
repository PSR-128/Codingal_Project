<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Clean Energy Quiz</title>

    <style>
       .root {
            --header-background: #333333; /* Define custom property */
        }

        body {
            font-family: Arial, sans-serif;
            background: #333333; /* Same background color as aqi.html */
            color: #fff; /* White text color */
            margin: 0;
            padding: 0;
        }

       .link-container {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            font-size: 14px;
            text-transform: uppercase;
            padding: 16px 10px;
            border-radius: 0 0 0 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-height: 50px;
            background-color: var(--header-background);
        }


       .link-container a {
            text-decoration: none;
            color: #7effb6;
            padding: 2px 5px;
            border-radius: 3px;
            margin: 0 5px;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

       .link-container a:hover {
            transform: translateY(-2px);
        }

        header {
            background-color: #333333; /* Header background color */
            padding: 20px;
            text-align: center;
        }

        #quiz {
            max-width: 550px;
            margin: 10px auto;
            background-color: #ffffff; /* Quiz background color */
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            position: relative;
            animation: slide-in 1s ease-out forwards;
        }

        h1 {
            margin-top: 0;
            color: #ff69b4; /* Set a fabulous color of your choice */
        }

        h2 {
            margin-bottom: 20px;
            color: #3EB489; /* Question text color */
        }

        form {
            margin-top: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            cursor: pointer;
            color: #fff; /* Label text color */
        }

        input[type="radio"] {
            margin-right: 10px;
            cursor: pointer;
        }

        #notification {
            display: none;
            background-color: #4caf50;
            color: #fff;
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            animation: slide-in 1s ease-out forwards;
        }

        #submitBtn {
            background-color: #3EB489;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
            display: block;
            margin: 0 auto;
            animation: slide-in 1s ease-out forwards;
        }

        #submitBtn:hover {
            background-color: #45a049;
        }

        #solarFacts {
            position: absolute;
            bottom: -80px;
            left: -100%; /* Initially set to left outside of the screen */
            width: calc(100% - 40px);
            padding: 20px;
            box-sizing: border-box;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            opacity: 0;
            text-align: center;
            transform: translateY(-50%);
            animation: solarFacts 2s ease-in-out forwards; /* Use the same animation name */
        }

        #solarFacts.show {
            left: 50%; /* Slide to center when shown */
            opacity: 1;
            transition: left 10s ease, opacity 2s ease; /* Added transition */
        }

        @keyframes solarFacts {
            to {
                left: 50%; /* Move to the center of the screen */
                transform: translateX(-50%);
            }
        }

        @keyframes slide-in {
            0% {
                transform: translateY(50px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .header {
            color: var(--link-color);
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 2px 12px;
            background-color: var(--header-background);
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 150px;
            margin-right: auto;
        }
        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background-color: #333333;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            color: #7effb6;
        }
        #quiz {
            max-width: 550px;
            margin: 10px auto;
            background-color: #ffffff; /* Quiz background color */
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            position: relative;
            animation: slide-in 1s ease-out forwards;
            margin-top: 20px; /* Add margin-top to create space between header and quiz */
        }
        #quizForm label {
            color: #333; /* Change the text color to dark gray */
        }


@media (max-width: 768px) {
    #quiz {
        margin-top: 50px; /* Adjust margin-top for smaller screens */
    }
}
    </style>
</head>
<body>
    <div class="link-container">
        <b><a href="home.html" class="link">Home</a>
        <a href="aqi.html" class="link">Air Quality</a>
        <a href="clean_energy.html" class="link">Clean Energy</a></b>
    </div>

    <header class = "header-container">
         <div class="header">QUIZ</div>
    </header>
    <header>
        <h1>Daily Clean Energy Quiz</h1>
    </header>
    <div id="quiz">
        <h2 id="question"></h2>
        <form id="quizForm"></form>
        <button id="submitBtn">Submit</button>
        <div id="notification"></div>
        <div id="solarFacts">
            <p>fun facts over here</p>
        </div>
    </div>
    <script>
        var quizData = [
            {
                'question': 'Which of the following is a renewable energy source?',
                'options': ['Coal', 'Solar', 'Natural Gas', 'Oil'],
                'answer': 'Solar'
            },
            {
                'question': 'What is the primary greenhouse gas emitted by burning fossil fuels?',
                'options': ['Carbon Dioxide', 'Nitrous Oxide', 'Methane', 'Ozone'],
                'answer': 'Carbon Dioxide'
            },
            {
                'question': 'Which renewable energy source generates electricity by harnessing the wind?',
                'options': ['Hydropower', 'Geothermal', 'Biomass', 'Wind'],
                'answer': 'Wind'
            }
        ];

        function loadQuiz() {
            var quizIndex = (new Date().getDay()) % quizData.length;
            var question = quizData[quizIndex].question;
            var options = quizData[quizIndex].options;
            var correctAnswer = quizData[quizIndex].answer;
            var quizForm = document.getElementById('quizForm');
            var html = '';

            document.getElementById('question').textContent = question;

            options.forEach(function(option, index) {
                html += '<label><input type="radio" name="answer" id="option' + index + '" value="' + option + '"> ' + option + '</label>';
            });

            quizForm.innerHTML = html;
        }

        function showNotification(message) {
            var notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.display = 'block';
            setTimeout(function() {
                notification.style.display = 'none';
            }, 3000); // Hide after 3 seconds
        }

        window.onload = function() {
            loadQuiz();
            var submitBtn = document.getElementById('submitBtn');
            var solarFacts = document.getElementById('solarFacts');
            submitBtn.addEventListener('click', function(event) {
                event.preventDefault();
                var selectedAnswer = document.querySelector('input[name="answer"]:checked');
                if (!selectedAnswer) {
                    alert('Please select an answer.');
                    return;
                }
                var correctAnswer = quizData[(new Date().getDay()) % quizData.length].answer;
                if (selectedAnswer.value === correctAnswer) {
                    showNotification('Correct! Well done!');
                } else {
                    showNotification('Incorrect. The correct answer is: ' + correctAnswer);
                }
                solarFacts.classList.add('show');
                setTimeout(function() {
                    solarFacts.style.left = '50%';
                    solarFacts.style.opacity = '1';
                }, 1000); // Wait for the previous animation to complete
            });

            // Fix for radio buttons not functioning
            var radioInputs = document.querySelectorAll('input[type="radio"]');
            radioInputs.forEach(function(radioInput) {
                radioInput.addEventListener('change', function() {
                    var notification = document.getElementById('notification');
                    notification.style.display = 'none';
                });
            });
        }
    </script>
</body>
</html>
